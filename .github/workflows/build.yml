name: build-installers

# 全平台安装包 CI：推送到 main / 打 v* 标签 / 手动触发
#   windows-latest → NSIS 安装包（原生构建，exe 图标完整）
#   macos-latest   → dmg ×2（x64 + arm64）
#   ubuntu-latest  → deb + 免安装 tar.gz（复用 build-deb.sh）
# 产物在该次 run 的 Artifacts 区下载。

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cmd: "npx electron-builder --win nsis --publish never"
            paths: "dist/electron-builder/*.exe"
          - os: macos-latest
            cmd: "npx electron-builder --mac dmg --x64 --arm64 --publish never"
            paths: "dist/electron-builder/*.dmg"
          - os: ubuntu-latest
            cmd: "./build-deb.sh"
            paths: |
              dist/sapper-ui_*.deb
              dist/sapper-ui-*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # --publish never：发布统一由 release job 负责（GH_TOKEN 会让 electron-builder
      # 在 tag 构建时自行创建 Release，而 build job 无写权限，会 403）
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  # 推 v* 标签时：把三平台产物发布到 GitHub Release（首页右侧 Releases）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: assets-to-release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: assets-to-release/**/*
